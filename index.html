<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的个人主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #eaeaea;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 640px;
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 48px 40px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    .avatar {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f5af19, #f12711);
      margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px; font-weight: bold; color: #fff;
    }
    h1 { font-size: 28px; margin-bottom: 6px; }
    .subtitle { color: #9fb3c8; font-size: 15px; margin-bottom: 28px; }
    .section { text-align: left; margin-bottom: 24px; }
    .section h2 {
      font-size: 16px; color: #f5af19;
      margin-bottom: 10px; letter-spacing: 1px;
    }
    .section p, .section li { font-size: 14.5px; line-height: 1.8; color: #cfd8dc; }
    .section ul { list-style: none; }
    .section li::before { content: "▸ "; color: #f5af19; }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
    .links a {
      color: #eaeaea; text-decoration: none;
      padding: 9px 22px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      font-size: 14px; transition: all 0.2s;
    }
    .links a:hover { background: #f5af19; color: #1a1a1a; border-color: #f5af19; }
    footer { margin-top: 32px; font-size: 12px; color: #78909c; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">我</div>
    <h1>你的名字</h1>
    <p class="subtitle">金工241 · 学生 · 正在学习 GitHub Pages</p>

    <div class="section">
      <h2>关于我</h2>
      <p>大家好！这里是你的自我介绍：写一两句你的专业方向、兴趣爱好、目前正在学的东西。</p>
    </div>

    <div class="section">
      <h2>技能 / 正在学习</h2>
      <ul>
        <li>某项技能（改成你自己的，比如 C 语言、SolidWorks…）</li>
        <li>某项技能</li>
        <li>某项技能</li>
      </ul>
    </div>

    <div class="section">
      <h2>联系方式</h2>
      <div class="links">
        <a href="https://github.com/你的用户名">GitHub</a>
        <a href="mailto:你的邮箱@example.com">邮箱</a>
      </div>
    </div>

    <footer>© 2026 你的名字 · Built with GitHub Pages</footer>
  </div>
</body>
</html>
